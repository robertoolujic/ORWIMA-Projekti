<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model</title>
    <link href="images/logo.png" rel="icon">
    <link href="styles/header.css" rel="stylesheet">
    <link href="styles/footer.css" rel="stylesheet">
    <link href="styles/likebutton.css" rel="stylesheet">
    <link href="styles/model.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="header">
        <div class="header-left">
            <div class="header-icons">
                <a class="header-banner" href="index.html">eshGrab</a>
                <a class="icon" href="index.html">
                    <img src="images/logo.png">
                </a>
                <a class="icon" href="upload.html">
                    <img src="https://img.icons8.com/?size=100&id=14090&format=png&color=FFFFFF">
                </a>
            </div>
        </div>
        <form id="search-form" action="/index.html" method="GET">
            <input id="search-field" name="q" type="search" placeholder="Search...">
            <button class="search-button" type="submit"></button>
        </form>
        <div class="user-button">
            <a class="user-icon" href="user.html?id=aqecIWECEbTSH1odriz9">
                Profile <img src="https://img.icons8.com/?size=100&id=98957&format=png&color=FFFFFF">
            </a>
        </div>
    </div>
    <div class="page-content" id="page-content">
        <div id="gallery">
            <button onclick="modelPage.loadPreviousImage()">
                <img id="previousImageIcon">
            </button>
            <img id="thumbnail">
            <button onclick="modelPage.loadNextImage()">
                <img id="nextImageIcon">
            </button>
        </div>
        <div id="title"></div>
        <div class="info">
            <a id="creator">
                <img id="avatar"></img>
                <div id="name"></div>
            </a>
            <div id="buttons">
                <button type="button" id="share-button"></button>
                <button type="button" id="like-button"></button>
                <button type="button" id="collection-button"></button>
            </div>
        </div>
        <div id="description"></div>
    </div>
    <div class="footer">
        <div class="footer-left">
            <a href="faq.html">about us</a>
            <a href="faq.html">FAQ</a>
        </div>
        <div class="footer-center">
            FAQ
        </div>
        <div class="footer-right">
            FAQ
        </div>
    </div>
    <script type="module" src="scripts/model.js"></script>
</body>

</html>
