<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeshGrab - 3D model repository</title>
    <link href="images/logo.png" rel="icon">
    <link href="styles/header.css" rel="stylesheet">
    <link href="styles/footer.css" rel="stylesheet">
    <link href="styles/likebutton.css" rel="stylesheet">
    <link href="styles/container.css" rel="stylesheet">
    <link href="styles/index.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="header">
        <div class="header-left">
            <div class="header-icons">
                <a class="header-banner" href="index.html">eshGrab</a>
                <a class="icon" href="index.html">
                    <img src="images/logo.png">
                </a>
                <a class="icon" href="upload.html">
                    <img src="https://img.icons8.com/?size=100&id=14090&format=png&color=FFFFFF">
                </a>
            </div>
        </div>
        <form id="search-form" action="/index.html" method="GET">
            <input id="search-field" name ="q"  type="search" placeholder="Search...">
            <button class="search-button" type="submit"></button>
        </form>
        <div class="user-button">
            <a class="user-icon" href="user.html?id=aqecIWECEbTSH1odriz9">
                Profile <img src="https://img.icons8.com/?size=100&id=98957&format=png&color=FFFFFF">
            </a>
        </div>
    </div>
    <div class="homepage">
        <div class="homepage-banner">
            <img src="images/banner.png">
        </div>
        <div class="sorting">
            <div class="sorting-modes" id="sorting-modes">
                <button type="button" class="sorting-active" onclick="sortByPopularity(this)">Popular</button>
                <button type="button" class="sorting-inactive" onclick="sortByDate(this)">Latest</button>
                <button type="button" class="sorting-inactive" onclick="sortByMakes(this)">Most makes</button>
            </div>
            <div class="sorting-times" id="sorting-times">
                <button type="button" class="sorting-active" onclick="trimTime(this, 0)">All Time</button>
                <button type="button" class="sorting-inactive" onclick="trimTime(this, 365)">This Year</button>
                <button type="button" class="sorting-inactive" onclick="trimTime(this, 30)">30 days</button>
                <button type="button" class="sorting-inactive" onclick="trimTime(this, 7)">7 days</button>
            </div>
        </div>
        <div id="grid">
        </div>
    </div>
    <div class="footer">
        <div class="footer-left">
            <a href="faq.html">about us</a>
            <a href="faq.html">FAQ</a>
        </div>
        <div class="footer-center">
            FAQ
        </div>
        <div class="footer-right">
            FAQ
        </div>
    </div>

    <script type ="module" src="scripts/index.js"></script>
    <script src="scripts/sort.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js/dist/fuse.js"></script>
</body>

</html>
